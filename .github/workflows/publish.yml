name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm

    steps:
      - uses: actions/checkout@v6

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'yarn'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify npm supports trusted publishing
        run: |
          node -e "const [major, minor, patch] = require('child_process').execFileSync('npm', ['--version'], {encoding: 'utf8'}).trim().split('.').map(Number); if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) { console.error('Trusted publishing requires npm 11.5.1 or later'); process.exit(1); }"

      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node -e "const version = require('./package.json').version; const tag = process.env.RELEASE_TAG.replace(/^v/, ''); if (version !== tag) { console.error('Release tag ' + process.env.RELEASE_TAG + ' does not match package version ' + version); process.exit(1); }"

      - run: yarn install --immutable
      - run: yarn workspace docusaurus-og-demo build
      - run: npm publish --access public
